    <text x="58" y="25" text-anchor="middle" fill="#ddd6fe">RU + EN</text>
    <rect x="132" width="142" height="38" rx="19" fill="#0891b2" opacity="0.22" stroke="#67e8f9"/>
    <text x="203" y="25" text-anchor="middle" fill="#cffafe">Fact Guard</text>
    <rect x="290" width="190" height="38" rx="19" fill="#059669" opacity="0.22" stroke="#6ee7b7"/>
    <text x="385" y="25" text-anchor="middle" fill="#d1fae5">Explainable rules</text>
    <rect x="496" width="144" height="38" rx="19" fill="#475569" opacity="0.28" stroke="#94a3b8"/>
