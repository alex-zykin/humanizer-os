<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">HumanizerOS verified rewrite demo</title>
  <desc id="desc">A before and after product launch rewrite showing ten findings across eight rules and six protected facts preserved.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="750">A rewrite you can verify</text>
  <text x="60" y="103" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">HumanizerOS finds the patterns. Your agent rewrites the prose. Fact Guard checks the facts.</text>

  <g transform="translate(60 142)">
