    <text x="22" y="160" fill="#ecfdf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Launch: September 15, 2026</text>
    <text x="22" y="187" fill="#ecfdf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">$49/month · up to 25 seats</text>
    <text x="22" y="214" fill="#ecfdf5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">https://example.com/pro</text>
