    <text x="22" y="85" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">In today's fast-paced world,</text>
    <text x="22" y="112" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Acme Cloud Pro is not just another</text>
    <text x="22" y="139" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">product, but a pivotal milestone that</text>
    <text x="22" y="166" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">unlocks the full potential of teams...</text>
    <text x="22" y="214" fill="#fca5a5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Generic opening · stock contrast · inflated claim</text>
    <text x="22" y="241" fill="#fca5a5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">meta wording · vague experts · generic ending</text>
    <rect x="22" y="274" width="250" height="34" rx="17" fill="#312e81"/>
    <text x="147" y="297" text-anchor="middle" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">10 findings across 8 rules</text>
  </g>

  <g transform="translate(548 274)">
    <circle cx="52" cy="52" r="46" fill="#172554" stroke="#3b82f6"/>
    <path d="M32 52h33M57 38l14 14-14 14" fill="none" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

