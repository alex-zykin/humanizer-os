    <text x="26" y="27" fill="#34d399" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="750">FACT GUARD</text>
    <text x="26" y="50" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">2× Acme Cloud Pro · September 15, 2026 · $49 · 25 · https://example.com/pro</text>
    <text x="1046" y="39" text-anchor="end" fill="#86efac" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="750">VERIFIED ✓</text>
