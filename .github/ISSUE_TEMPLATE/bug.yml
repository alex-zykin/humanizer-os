name: Bug report
description: Report incorrect behavior that is not primarily a false positive.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste confidential text. Reduce the example to the smallest safe reproducer.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: humanizer-os 0.1.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or API call
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Did this change or expose a protected fact?
      options: ["No", "Yes", "Unsure"]
    validations:
      required: true
