name: Import Human Detectors benchmark candidates

on:
  push:
    branches:
      - benchmark/real-world-v1-batch-10
    paths:
      - .github/workflows/import-human-detectors-batch.yml

permissions:
  contents: write

concurrency:
  group: import-human-detectors-batch
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Import deterministic candidate batch
        run: python scripts/import_human_detectors_batch.py --limit 15
      - name: Commit imported candidates and remove one-shot workflow
        run: |
          rm .github/workflows/import-human-detectors-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: import Human Detectors candidate batch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
