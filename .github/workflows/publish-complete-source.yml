name: Publish complete HumanizerOS source

on:
  push:
    branches: [main]
    paths:
      - ".publish-complete-source"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-complete-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Replace bootstrap tree with verified source tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_TREE: 854d0cfbaea6fc6767645ade37a966a385778f72
        shell: bash
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          head_sha="$(curl -fsSL "${auth[@]}" "${api}/git/ref/heads/main" | jq -r '.object.sha')"
          test -n "${head_sha}"
          test "${head_sha}" != "null"

          commit_sha="$(
            jq -n \
              --arg message "feat: publish complete HumanizerOS source" \
              --arg tree "${TARGET_TREE}" \
              --arg parent "${head_sha}" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
            | curl -fsSL -X POST "${auth[@]}" \
                "${api}/git/commits" \
                --data-binary @- \
            | jq -r '.sha'
          )"
          test -n "${commit_sha}"
          test "${commit_sha}" != "null"

          jq -n --arg sha "${commit_sha}" '{sha: $sha, force: false}' \
            | curl -fsSL -X PATCH "${auth[@]}" \
                "${api}/git/refs/heads/main" \
                --data-binary @- >/dev/null

          echo "Published source tree ${TARGET_TREE} as commit ${commit_sha}" >> "${GITHUB_STEP_SUMMARY}"
