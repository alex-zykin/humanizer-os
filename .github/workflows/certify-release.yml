name: Certify HumanizerOS 0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certify-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: certify-humanizer-os-0-1-0
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply deterministic formatting and publish final source commit
        id: final_commit
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix .
          ruff format .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/certify-release.yml
          git add -A
          git commit -m "chore: certify HumanizerOS 0.1.0"
          git push origin HEAD:main

          final_sha="$(git rev-parse HEAD)"
          echo "sha=${final_sha}" >> "${GITHUB_OUTPUT}"
          echo "Final source commit: ${final_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run complete quality gates
        run: make all

      - name: Build and smoke-test release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build

          python -m venv /tmp/humanizer-os-certified-release
          /tmp/humanizer-os-certified-release/bin/python -m pip install --upgrade pip
          /tmp/humanizer-os-certified-release/bin/python -m pip install dist/*.whl
          /tmp/humanizer-os-certified-release/bin/humanizer-os --version
          printf 'In order to ship, test.\n' \
            | /tmp/humanizer-os-certified-release/bin/humanizer-os audit - --lang en --fail-on error
          /tmp/humanizer-os-certified-release/bin/python -m pip check

          (cd dist && sha256sum * > SHA256SUMS)

      - name: Mark final commit green
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=success \
            -f context='CI / launch certification' \
            -f description='Tests, evals, lint, types, docs, schemas and build passed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Repair v0.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh release delete v0.1.0 --yes >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.0" >/dev/null 2>&1 || true
          git tag -d v0.1.0 >/dev/null 2>&1 || true

          git tag -a v0.1.0 "${FINAL_SHA}" -m "HumanizerOS 0.1.0"
          git push origin refs/tags/v0.1.0 --force

          cat > /tmp/release-notes.md <<'EOF'
          HumanizerOS 0.1.0 is the first complete public release.

          Highlights:
          - 31 English and 34 Russian explainable rules;
          - local-first, dependency-free runtime;
          - Fact Guard for protected values and code;
          - text, JSON, and SARIF output;
          - CLI, Python API, Agent Skills, schemas, tests, and bilingual evals.

          The attached artifacts were built from the tagged commit after the complete launch certification passed.
          EOF

          gh release create v0.1.0 \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "HumanizerOS 0.1.0" \
            --notes-file /tmp/release-notes.md

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v0.1.0" >> "${GITHUB_STEP_SUMMARY}"

      - name: Try to fill the About section with an available admin token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GH_PAT || secrets.PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Open-source multilingual text humanization for English and Russian with explainable rules, Fact Guard, CLI, Python API, JSON/SARIF, and Agent Skills.' >/dev/null

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -H 'Accept: application/vnd.github+json' \
            -f 'names[]=humanizer' \
            -f 'names[]=text-humanization' \
            -f 'names[]=text-editing' \
            -f 'names[]=natural-language-processing' \
            -f 'names[]=nlp' \
            -f 'names[]=russian' \
            -f 'names[]=english' \
            -f 'names[]=python' \
            -f 'names[]=cli' \
            -f 'names[]=agent-skills' \
            -f 'names[]=sarif' \
            -f 'names[]=fact-preservation' \
            -f 'names[]=writing-tools' >/dev/null

      - name: Mark final commit failed when certification fails
        if: failure() && steps.final_commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=failure \
            -f context='CI / launch certification' \
            -f description='Launch certification failed; inspect the workflow logs' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
