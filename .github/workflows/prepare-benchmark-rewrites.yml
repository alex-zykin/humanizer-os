name: Prepare pilot benchmark rewrites

on:
  push:
    branches:
      - benchmark/real-world-v1-batch-10
    paths:
      - .github/workflows/prepare-benchmark-rewrites.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Create conservative rewrites and verify them
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          from humanizer_os import Analyzer, verify_texts

          root = Path.cwd()
          base = root / "benchmarks" / "real-world-v1" / "candidates"
          selected = [
              "human-detectors-gpt-4o-record-46",
              "human-detectors-paraphrased-gpt-4o-record-52",
              "human-detectors-paraphrased-gpt-4o-record-35",
              "human-detectors-gpt-4o-record-40",
              "human-detectors-humanized-o1-pro-record-47",
              "human-detectors-claude-record-0",
              "human-detectors-o1-pro-record-46",
              "human-detectors-claude-record-27",
              "human-detectors-paraphrased-gpt-4o-record-50",
          ]
          normalize_breaks = {
              "human-detectors-paraphrased-gpt-4o-record-52",
              "human-detectors-paraphrased-gpt-4o-record-35",
              "human-detectors-claude-record-0",
              "human-detectors-claude-record-27",
              "human-detectors-paraphrased-gpt-4o-record-50",
          }
          replacements = {
              "human-detectors-gpt-4o-record-40": [
                  (
                      "the creation of cyborg worms represents a fascinating glimpse into a future where technology and nature work hand in hand.",
                      "the creation of cyborg worms offers a glimpse of a future where technology and nature work hand in hand.",
                  )
              ],
              "human-detectors-claude-record-27": [
                  (
                      "Legal experts suggest these lawsuits could have far-reaching implications for social media regulation.",
                      "If successful, these lawsuits could have far-reaching implications for social media regulation.",
                  )
              ],
              "human-detectors-paraphrased-gpt-4o-record-50": [
                  ("In summary, AI agents signify", "AI agents signify")
              ],
          }

          analyzer = Analyzer()
          failures = []
          for sample_id in selected:
              directory = base / sample_id
              source = (directory / "source.md").read_text(encoding="utf-8")
              rewrite = source
              if sample_id in normalize_breaks:
                  rewrite = rewrite.replace("<br/><br/>", "\n\n")
                  rewrite = rewrite.replace("<br><br>", "\n\n")
              for before, after in replacements.get(sample_id, []):
                  if before not in rewrite:
                      raise SystemExit(f"replacement source not found for {sample_id}: {before}")
                  rewrite = rewrite.replace(before, after, 1)
              (directory / "rewrite.md").write_text(rewrite, encoding="utf-8")

              source_report = analyzer.audit(source, locale="en", genre="article")
              rewrite_report = analyzer.audit(rewrite, locale="en", genre="article")
              verification = verify_texts(source, rewrite)
              payload = {
                  "sample_id": sample_id,
                  "source_words": source_report.metrics["words"],
                  "rewrite_words": rewrite_report.metrics["words"],
                  "source_rule_counts": dict(
                      sorted(Counter(item.rule_id for item in source_report.findings).items())
                  ),
                  "rewrite_rule_counts": dict(
                      sorted(Counter(item.rule_id for item in rewrite_report.findings).items())
                  ),
                  "fact_guard": {
                      "ok": verification.ok,
                      "protected_facts": verification.original_count,
                      "lost": list(verification.lost),
                      "added": list(verification.added),
                  },
              }
              (directory / "rewrite-audit.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              if rewrite_report.findings or not verification.ok:
                  failures.append(payload)

          if failures:
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              raise SystemExit("one or more pilot rewrites failed audit or Fact Guard")
          PY
      - name: Commit rewrites and remove one-shot workflow
        run: |
          rm .github/workflows/prepare-benchmark-rewrites.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: add verified pilot rewrites"
          git push origin "HEAD:${GITHUB_REF_NAME}"
