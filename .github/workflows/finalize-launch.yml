name: Finalize HumanizerOS launch

on:
  push:
    branches: [main]
    paths:
      - ".finalize-humanizer-os-launch"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-humanizer-os-launch
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run launch quality gates
        run: |
          make check
          make lint
          make typecheck
          make self-audit

      - name: Remove one-shot launch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .finalize-humanizer-os-launch .github/workflows/finalize-launch.yml
          git commit -m "chore: finalize repository launch"
          git push origin HEAD:main

      - name: Build and smoke-test release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist build
          python -m build
          python -m venv /tmp/humanizer-os-release-smoke
          /tmp/humanizer-os-release-smoke/bin/python -m pip install --upgrade pip
          /tmp/humanizer-os-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/humanizer-os-release-smoke/bin/humanizer-os --version
          printf 'In order to ship, test.\n' \
            | /tmp/humanizer-os-release-smoke/bin/humanizer-os audit --lang en
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Repair v0.1.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          git tag -d v0.1.0 2>/dev/null || true
          git tag -a v0.1.0 -m "HumanizerOS 0.1.0" HEAD
          git push origin refs/tags/v0.1.0 --force

          gh release delete v0.1.0 --yes 2>/dev/null || true
          cat > /tmp/release-notes.md <<'EOF'
          HumanizerOS 0.1.0 is the first complete public release.

          Highlights:
          - 31 English and 34 Russian explainable rules;
          - local-first, dependency-free runtime;
          - Fact Guard for protected values and code;
          - text, JSON, and SARIF output;
          - CLI, Python API, Agent Skills, schemas, tests, and bilingual evals.

          The release artifacts below were built from the tagged commit and smoke-tested in a clean virtual environment.
          EOF

          gh release create v0.1.0 \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "HumanizerOS 0.1.0" \
            --notes-file /tmp/release-notes.md
