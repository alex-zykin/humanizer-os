name: Bootstrap source

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path
          import sys

          target_length = 165_808
          target_sha256 = "72d1c133aa16c44549520f5c8acfcff9be4db14bbcf14eeb209b828dd6b2f47d"

          prefix_paths = [
              "bootstrap/parts/part-00",
              "bootstrap/parts/part-01",
              "bootstrap/parts/part-02",
              "bootstrap/parts/part-03",
              "bootstrap/parts/part-04",
              "bootstrap/recovery/seg-00",
              "bootstrap/recovery/seg-01",
              "bootstrap/recovery/seg-02",
              "bootstrap/recovery/seg-03",
              "bootstrap/recovery/seg-04",
              "bootstrap/parts/part-07",
              "bootstrap/recovery/seg-05",
              "bootstrap/recovery/seg-06",
              "bootstrap/recovery/seg-07-00",
              "bootstrap/recovery/seg-07-01",
          ]

          current = "".join(Path(path).read_text() for path in prefix_paths)
          if len(current) != 150_000:
              raise SystemExit(f"Unexpected verified prefix length: {len(current)}")

          fragments = {
              str(path): path.read_text()
              for path in Path("bootstrap").rglob("*")
              if path.is_file()
          }

          def candidate_extensions(value: str) -> list[tuple[int, int, str, str]]:
              remaining = target_length - len(value)
              candidates: list[tuple[int, int, str, str]] = []
              for path, fragment in fragments.items():
                  maximum_overlap = min(6_000, len(value), len(fragment))
                  for overlap in range(maximum_overlap, 31, -1):
                      start = fragment.find(value[-overlap:])
                      if start >= 0:
                          extension = fragment[start + overlap : start + overlap + remaining]
                          if extension:
                              candidates.append((overlap, len(extension), path, extension))
                          break
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              return candidates

          seen: set[tuple[int, str]] = set()

          def assemble(value: str, depth: int = 0) -> str | None:
              state = (len(value), value[-64:])
              if state in seen:
                  return None
              seen.add(state)

              if len(value) == target_length:
                  try:
                      raw = base64.b64decode(value, validate=True)
                  except Exception:
                      return None
                  digest = hashlib.sha256(raw).hexdigest()
                  return value if digest == target_sha256 else None

              if len(value) > target_length or depth > 20:
                  return None

              for _overlap, _length, _path, extension in candidate_extensions(value)[:30]:
                  result = assemble(value + extension, depth + 1)
                  if result is not None:
                      return result
              return None

          encoded = assemble(current)
          if encoded is None:
              raise SystemExit("Could not reconstruct the verified source archive")

          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != target_sha256:
              raise SystemExit(f"Archive checksum mismatch: {digest}")

          Path("/tmp/humanizer-os.zip").write_bytes(archive)
          print(f"Verified source archive: {len(archive)} bytes, sha256={digest}")
          PY

          mkdir -p /tmp/humanizer-os-source
          unzip -q /tmp/humanizer-os.zip -d /tmp/humanizer-os-source
          rsync -a /tmp/humanizer-os-source/ ./
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch HumanizerOS 0.1.0"
          git push
