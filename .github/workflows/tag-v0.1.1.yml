name: Tag HumanizerOS v0.1.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tag-v0.1.1.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create annotated release tag
        env:
          TARGET_SHA: f293db211489961213b78bced11c166445aa8338
          RELEASE_TAG: v0.1.1
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
            if [ -z "${remote_sha}" ]; then
              remote_sha="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
            fi
            test "${remote_sha}" = "${TARGET_SHA}"
            exit 0
          fi

          git tag -a "${RELEASE_TAG}" "${TARGET_SHA}" -m "HumanizerOS 0.1.1"
          git push origin "refs/tags/${RELEASE_TAG}"
