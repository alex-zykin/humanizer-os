name: Prepare v0.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-v0.1.1.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Update release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "0.1.1"
          release_date = "2026-08-25"

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace("pyproject.toml", 'version = "0.1.0"', f'version = "{version}"')
          replace(
              "src/humanizer_os/_version.py",
              '__version__ = "0.1.0"',
              f'__version__ = "{version}"',
          )
          replace("SKILL.md", 'version: "0.1.0"', f'version: "{version}"')
          replace("CITATION.cff", 'version: "0.1.0"', f'version: "{version}"')
          replace("CITATION.cff", "date-released: 2026-08-19", f"date-released: {release_date}")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [0.1.0] - 2026-08-19"
          section = f'''## [{version}] - {release_date}

          ### Added

          - A provenance-tracked real-world AI-writing demo from the MIT-licensed Human Detectors dataset.
          - Real-World Benchmark v1 foundations with a versioned manifest, schema, runner, and pilot regression test.
          - Warning-level self-audit regression coverage for the public README, canonical Agent Skill, and brand guide.

          ### Changed

          - Expanded English significance patterns using a released machine-generated nonfiction sample plus a negative fixture.
          - Reworked the English-first README around installation, verifiable demos, and the Agent Skill plus Fact Guard workflow.
          - Tightened the canonical Agent Skill and public brand guidance.

          ### Fixed

          - Fact Guard now preserves direct quotations while allowing straight and curly quote typography changes.
          - Proper-name extraction no longer treats sentence-leading phrases or titles such as `As Dr.` as names.
          - Quote normalization now passes strict mypy checks.
          - Public documentation self-audit no longer fails on deliberately bad AI text shown inside protected code blocks.

          '''
          if marker not in text:
              raise SystemExit(f"Changelog marker not found: {marker}")
          text = text.replace(marker, section + marker, 1)
          text = text.replace(
              "compare/v0.1.0...HEAD",
              f"compare/v{version}...HEAD",
          )
          if f"[{version}]:" not in text:
              text += (
                  f"\n[{version}]: https://github.com/alex-zykin/humanizer-os/"
                  f"compare/v0.1.0...v{version}\n"
              )
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate release candidate
        run: make all

      - name: Commit the release candidate
        run: |
          rm .github/workflows/prepare-v0.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare HumanizerOS 0.1.1"
          git push origin HEAD:main
