name: Final CI and release sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-ci-and-release.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: final-ci-and-release-sync
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Remove this one-shot workflow and publish final commit
        id: final_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-ci-and-release.yml
          git commit -m "chore: complete HumanizerOS 0.1.0 launch"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=${final_sha}" >> "${GITHUB_OUTPUT}"
          echo "Final commit: ${final_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Dispatch the normal CI workflow on the final commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh run list \
                --workflow ci.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"${FINAL_SHA}\") | .databaseId" \
              | head -n 1
            )"
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${run_id}" ]; then
            echo "Could not locate CI run for ${FINAL_SHA}" >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "${GITHUB_STEP_SUMMARY}"
          gh run watch "${run_id}" --exit-status --interval 5

      - name: Build and smoke-test release artifacts from the final commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build

          python -m venv /tmp/humanizer-os-final-release
          /tmp/humanizer-os-final-release/bin/python -m pip install --upgrade pip
          /tmp/humanizer-os-final-release/bin/python -m pip install dist/*.whl
          /tmp/humanizer-os-final-release/bin/humanizer-os --version
          printf 'In order to ship, test.\n' \
            | /tmp/humanizer-os-final-release/bin/humanizer-os audit - --lang en --fail-on error
          /tmp/humanizer-os-final-release/bin/python -m pip check
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Synchronize tag and GitHub Release with the final commit
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.1.0 --yes >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.0" >/dev/null 2>&1 || true
          git tag -d v0.1.0 >/dev/null 2>&1 || true

          git tag -a v0.1.0 "${FINAL_SHA}" -m "HumanizerOS 0.1.0"
          git push origin refs/tags/v0.1.0 --force

          cat > /tmp/release-notes.md <<'EOF'
          HumanizerOS 0.1.0 is the first complete public release.

          Highlights:
          - 31 English and 34 Russian explainable rules;
          - local-first, dependency-free runtime;
          - Fact Guard for protected values and code;
          - text, JSON, and SARIF output;
          - CLI, Python API, Agent Skills, schemas, tests, and bilingual evals.

          The attached artifacts were built from the tagged commit after the normal CI workflow passed on that exact commit.
          EOF

          gh release create v0.1.0 \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "HumanizerOS 0.1.0" \
            --notes-file /tmp/release-notes.md

      - name: Record final launch status
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=success \
            -f context='CI / launch certification' \
            -f description='Normal CI and release certification passed on the tagged commit' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" >/dev/null

      - name: Mark final commit failed when finalization fails
        if: failure() && steps.final_commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=failure \
            -f context='CI / launch certification' \
            -f description='Final CI or release synchronization failed' \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
