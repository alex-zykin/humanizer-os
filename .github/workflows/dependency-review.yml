name: Dependency review

on:
  pull_request:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Dependency graph is disabled; enable it in Settings → Code security and analysis to enforce dependency review."
          fi
      - uses: actions/dependency-review-action@v4
        if: steps.dependency-graph.outputs.enabled == 'true'
