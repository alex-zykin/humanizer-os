name: Retry Human Detectors benchmark import

on:
  push:
    branches:
      - benchmark/real-world-v1-batch-10
    paths:
      - .github/workflows/trigger-human-detectors-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Broaden candidate window and import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/import_human_detectors_batch.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "if not 220 <= words <= 450:",
              "if not 100 <= words <= 2000:",
          )
          text = text.replace(
              '"word_range": [220, 450],',
              '"word_range": [100, 2000],',
          )
          text = text.replace(
              'parser.add_argument("--limit", type=int, default=15)',
              'parser.add_argument("--limit", type=int, default=20)',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python scripts/import_human_detectors_batch.py --limit 20
      - name: Commit candidates and remove one-shot workflows
        run: |
          rm .github/workflows/import-human-detectors-batch.yml
          rm .github/workflows/trigger-human-detectors-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: import Human Detectors candidate batch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
