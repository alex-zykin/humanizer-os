name: Audit selected benchmark candidates

on:
  push:
    branches:
      - benchmark/real-world-v1-batch-10
    paths:
      - .github/workflows/audit-benchmark-batch.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Audit the nine-sample pilot selection
        run: |
          python - <<'PY'
          from collections import Counter
          import json
          from pathlib import Path

          from humanizer_os import Analyzer, verify_texts

          root = Path.cwd()
          base = root / "benchmarks" / "real-world-v1" / "candidates"
          selected = [
              "human-detectors-gpt-4o-record-46",
              "human-detectors-paraphrased-gpt-4o-record-52",
              "human-detectors-paraphrased-gpt-4o-record-35",
              "human-detectors-gpt-4o-record-40",
              "human-detectors-humanized-o1-pro-record-47",
              "human-detectors-claude-record-0",
              "human-detectors-o1-pro-record-46",
              "human-detectors-claude-record-27",
              "human-detectors-paraphrased-gpt-4o-record-50",
          ]
          analyzer = Analyzer()
          selection_rows = []
          for sample_id in selected:
              directory = base / sample_id
              source_path = directory / "source.md"
              text = source_path.read_text(encoding="utf-8")
              report = analyzer.audit(text, locale="en", genre="article")
              verification = verify_texts(text, text)
              rule_counts = dict(
                  sorted(Counter(item.rule_id for item in report.findings).items())
              )
              payload = {
                  "sample_id": sample_id,
                  "source_path": str(source_path.relative_to(root)),
                  "metrics": report.metrics,
                  "rule_counts": rule_counts,
                  "protected_facts": verification.original_count,
                  "findings": [
                      {
                          **item.to_dict(),
                          "matched_text": text[item.start : item.end],
                      }
                      for item in report.findings
                  ],
              }
              (directory / "audit.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              selection_rows.append(
                  {
                      "sample_id": sample_id,
                      "words": report.metrics["words"],
                      "findings": len(report.findings),
                      "rule_counts": rule_counts,
                      "protected_facts": verification.original_count,
                  }
              )

          (base / "selection.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "target_total_samples": 10,
                      "existing_seed_samples": 1,
                      "selected_candidates": selection_rows,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit audits and remove one-shot workflow
        run: |
          rm .github/workflows/audit-benchmark-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "benchmark: audit nine-sample pilot selection"
          git push origin "HEAD:${GITHUB_REF_NAME}"
