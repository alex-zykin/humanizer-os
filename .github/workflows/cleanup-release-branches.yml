name: Clean temporary branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-release-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete completed work branches
        run: |
          git push origin --delete fix/green-self-audit || true
          git push origin --delete benchmark/real-world-v1 || true

      - name: Remove this one-shot workflow
        run: |
          rm .github/workflows/cleanup-release-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: clean temporary work branches"
          git push origin HEAD:main
