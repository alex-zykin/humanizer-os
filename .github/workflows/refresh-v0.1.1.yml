name: Refresh v0.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-v0.1.1.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate the complete source tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python scripts/benchmark_real_world.py
          make all
          test "$(humanizer-os --version)" = "humanizer-os 0.1.1"

      - name: Create a clean release commit
        run: |
          rm .github/workflows/refresh-v0.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: include Real-World Benchmark v1 in 0.1.1"
          git push origin HEAD:main

      - name: Replace the release tag
        run: |
          gh release delete v0.1.1 --yes --cleanup-tag || true
          git tag -d v0.1.1 2>/dev/null || true
          git push origin :refs/tags/v0.1.1 || true
          git tag -a v0.1.1 -m "HumanizerOS 0.1.1"
          git push origin v0.1.1
