name: Publish HumanizerOS v0.1.1

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.1.1.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.1.1
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag and package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if version != "0.1.1":
              raise SystemExit(f"expected 0.1.1, found {version!r}")
          PY
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: python scripts/check_release.py
      - run: python scripts/check_docs.py
      - run: python scripts/generate_rule_catalog.py --check
      - name: Self-audit project prose
        run: make selfcheck
      - run: python -m build
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Smoke-test wheel and source distribution
        run: |
          python -m venv /tmp/humanizer-os-release
          /tmp/humanizer-os-release/bin/python -m pip install dist/*.whl
          /tmp/humanizer-os-release/bin/humanizer-os --version
          /tmp/humanizer-os-release/bin/python -m pip check

          mkdir -p /tmp/humanizer-os-sdist-wheel
          python -m pip wheel --no-deps \
            dist/*.tar.gz -w /tmp/humanizer-os-sdist-wheel
          python -m venv /tmp/humanizer-os-sdist-release
          /tmp/humanizer-os-sdist-release/bin/python -m pip install \
            /tmp/humanizer-os-sdist-wheel/*.whl
          /tmp/humanizer-os-sdist-release/bin/humanizer-os --version
          /tmp/humanizer-os-sdist-release/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: humanizer-os-v0.1.1
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.1 >/dev/null 2>&1; then
            gh release upload v0.1.1 dist/* --clobber
          else
            gh release create v0.1.1 dist/* \
              --title "HumanizerOS 0.1.1" \
              --generate-notes \
              --verify-tag
          fi
