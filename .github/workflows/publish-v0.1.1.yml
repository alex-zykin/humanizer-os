name: Publish v0.1.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.1.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate the tagged source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          make all
          test "$(humanizer-os --version)" = "humanizer-os 0.1.1"

      - name: Create the clean release commit and tag
        run: |
          rm .github/workflows/publish-v0.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize HumanizerOS 0.1.1 release"
          git tag -a v0.1.1 -m "HumanizerOS 0.1.1"
          git push origin HEAD:main
          git push origin v0.1.1
