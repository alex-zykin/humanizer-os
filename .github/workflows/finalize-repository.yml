name: Finalize repository setup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-repository.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  statuses: write

concurrency:
  group: finalize-repository-setup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run all quality gates
        run: make all

      - name: Fill repository About section
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='Open-source multilingual text humanization for English and Russian with explainable rules, Fact Guard, CLI, Python API, JSON/SARIF, and Agent Skills.' \
            -F has_issues=true \
            -F has_discussions=true \
            -F delete_branch_on_merge=true >/dev/null

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -H 'Accept: application/vnd.github+json' \
            -f 'names[]=humanizer' \
            -f 'names[]=text-humanization' \
            -f 'names[]=text-editing' \
            -f 'names[]=natural-language-processing' \
            -f 'names[]=nlp' \
            -f 'names[]=russian' \
            -f 'names[]=english' \
            -f 'names[]=python' \
            -f 'names[]=cli' \
            -f 'names[]=agent-skills' \
            -f 'names[]=sarif' \
            -f 'names[]=fact-preservation' \
            -f 'names[]=writing-tools' >/dev/null

      - name: Remove temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in agent/publish-complete-source agent/push-files-probe; do
            encoded="${branch//\//%2F}"
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" >/dev/null 2>&1; then
              echo "Deleted ${branch}"
            else
              echo "Branch ${branch} was already absent"
            fi
          done

      - name: Remove this one-shot workflow and publish the final commit
        id: final_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-repository.yml
          git commit -m "chore: complete repository setup"
          git push origin HEAD:main
          final_sha="$(git rev-parse HEAD)"
          echo "sha=${final_sha}" >> "${GITHUB_OUTPUT}"
          echo "Final commit: ${final_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run CI against the final commit
        id: final_ci
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref main

          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(
              gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
                -f branch=main \
                -f event=workflow_dispatch \
                -f per_page=20 \
                --jq ".workflow_runs[] | select(.head_sha == \"${FINAL_SHA}\") | .id" \
              | head -n 1
            )"
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${run_id}" ]; then
            echo "Could not find the dispatched CI run for ${FINAL_SHA}" >&2
            exit 1
          fi

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "Waiting for CI run ${run_id} on ${FINAL_SHA}"

          for _ in $(seq 1 120); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // ""')"
            echo "CI status=${status} conclusion=${conclusion:-pending}"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" != "success" ]; then
                echo "CI failed with conclusion ${conclusion}" >&2
                exit 1
              fi
              echo "CI passed: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for CI run ${run_id}" >&2
          exit 1

      - name: Build release artifacts from the final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build

          python -m venv /tmp/humanizer-os-final-release
          /tmp/humanizer-os-final-release/bin/python -m pip install --upgrade pip
          /tmp/humanizer-os-final-release/bin/python -m pip install dist/*.whl
          /tmp/humanizer-os-final-release/bin/humanizer-os --version
          printf 'In order to ship, test.\n' \
            | /tmp/humanizer-os-final-release/bin/humanizer-os audit - --lang en --fail-on error
          /tmp/humanizer-os-final-release/bin/python -m pip check

          (cd dist && sha256sum * > SHA256SUMS)

      - name: Repair v0.1.0 tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final_commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh release delete v0.1.0 --yes >/dev/null 2>&1 || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.1.0" >/dev/null 2>&1 || true

          git tag -f -a v0.1.0 "${FINAL_SHA}" -m "HumanizerOS 0.1.0"
          git push origin refs/tags/v0.1.0 --force

          cat > /tmp/release-notes.md <<'EOF'
          HumanizerOS 0.1.0 is the first complete public release.

          Highlights:
          - 31 English and 34 Russian explainable rules;
          - local-first, dependency-free runtime;
          - Fact Guard for protected values and code;
          - text, JSON, and SARIF output;
          - CLI, Python API, Agent Skills, schemas, tests, and bilingual evals.

          The attached artifacts were built from the tagged commit after the final CI run passed.
          EOF

          gh release create v0.1.0 \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "HumanizerOS 0.1.0" \
            --notes-file /tmp/release-notes.md

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v0.1.0" >> "${GITHUB_STEP_SUMMARY}"
