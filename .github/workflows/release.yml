name: Release

on:
  push:
    tags:
      - "v*"

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          PY
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: python scripts/check_release.py
      - run: python scripts/check_docs.py
      - run: python scripts/generate_rule_catalog.py --check
      - name: Self-audit project prose
        run: make selfcheck
      - run: python -m build
      - name: Create checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Smoke-test wheel and source distribution
        run: |
          python -m venv /tmp/humanizer-os-release
          /tmp/humanizer-os-release/bin/python -m pip install dist/*.whl
          /tmp/humanizer-os-release/bin/humanizer-os --version
          /tmp/humanizer-os-release/bin/python -m pip check

          mkdir -p /tmp/humanizer-os-sdist-wheel
          python -m pip wheel --no-deps \
            dist/*.tar.gz -w /tmp/humanizer-os-sdist-wheel
          python -m venv /tmp/humanizer-os-sdist-release
          /tmp/humanizer-os-sdist-release/bin/python -m pip install \
            /tmp/humanizer-os-sdist-wheel/*.whl
          /tmp/humanizer-os-sdist-release/bin/humanizer-os --version
          /tmp/humanizer-os-sdist-release/bin/python -m pip check
      - uses: actions/upload-artifact@v7
        with:
          name: humanizer-os-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
