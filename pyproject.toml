[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer-os"
version = "0.1.0"
description = "Open-source multilingual text humanization platform with explainable audits and fact-safe fixes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Alex Zykin" },
]
keywords = [
  "writing",
  "linting",
  "editing",
  "russian",
  "english",
  "nlp",
  "ai-writing",
  "humanizer",
  "text-humanization",
  "agent-skills",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jsonschema>=4.23",
  "mypy>=2.3",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.15.22",
]

[project.scripts]
humanizer-os = "humanizer_os.cli:main"

[project.urls]
Homepage = "https://github.com/alex-zykin/humanizer-os"
Documentation = "https://github.com/alex-zykin/humanizer-os/tree/main/docs"
Issues = "https://github.com/alex-zykin/humanizer-os/issues"
Source = "https://github.com/alex-zykin/humanizer-os"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"humanizer_os" = ["py.typed"]
"humanizer_os.data.rules" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["humanizer_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["E501"]


[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src/humanizer_os"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
